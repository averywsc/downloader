name: Build & Release Dodown

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install Python 3.13 & dependencies
        shell: pwsh
        run: |
          uv python install 3.13
          uv sync

      - name: Build Dodown.exe with Nuitka
        shell: pwsh
        run: |
          uv run pyside6-rcc app/assets/resources.qrc -o app/assets/resources.rcc
          uv run python scripts/deploy.py

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $ver = uv run python -c "from app.config.constants import VERSION; print(VERSION)"
          Compress-Archive -Path "dist\Dodown.dist\*" -DestinationPath "dist\Dodown-v$ver-Windows-x64-Portable.zip" -Force

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = uv run python -c "from app.config.constants import VERSION; print(VERSION)"
          iscc "/DMyAppVersion=$ver" "/DMyAppArchitectures=x64compatible" "scripts\Dodown.iss"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dodown-windows
          path: |
            dist/Dodown-*-Windows-x64-Portable.zip
            dist/Dodown-*-Windows-Setup.exe

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install Python 3.13 & dependencies
        run: |
          uv python install 3.13
          uv sync

      - name: Build Dodown.app with Nuitka
        run: |
          uv run pyside6-rcc app/assets/resources.qrc -o app/assets/resources.rcc
          uv run python scripts/deploy.py

      - name: Package macOS ZIP
        run: |
          VER=$(uv run python -c "from app.config.constants import VERSION; print(VERSION)")
          ditto -c -k --sequesterRsrc --keepParent "dist/Dodown.app" "dist/Dodown-v${VER}-macOS-arm64.zip"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dodown-macos
          path: dist/Dodown-*-macOS-arm64.zip

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache libegl1-mesa-dev libzstd1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install Python 3.13 & dependencies
        run: |
          uv python install 3.13
          uv sync

      - name: Build Dodown with Nuitka
        run: |
          uv run pyside6-rcc app/assets/resources.qrc -o app/assets/resources.rcc
          uv run python scripts/deploy.py

      - name: Package Linux tar.gz
        run: |
          VER=$(uv run python -c "from app.config.constants import VERSION; print(VERSION)")
          tar -czf "dist/Dodown-v${VER}-Linux-x64.tar.gz" -C dist Dodown.dist

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dodown-linux
          path: dist/Dodown-*-Linux-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "exec(open('app/config/constants.py').read()); print(VERSION)")
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v${VER}"
          fi
          gh release create "$TAG" release-assets/* \
            --title "Dodown $TAG" \
            --notes "Dodown $TAG — Fast, multi-protocol desktop download manager with the Totone Studio UI. More at https://averybeuth.xyz" \
            --latest || gh release upload "$TAG" release-assets/* --clobber
