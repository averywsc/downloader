name: Test Dodown

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  syntax-and-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libzstd1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install Python 3.13 & dependencies
        run: |
          uv python install 3.13
          uv sync --dev

      - name: Verify Python syntax
        run: |
          uv run python -c "
          import ast
          from pathlib import Path
          for p in Path('.').rglob('*.py'):
              if any(part.startswith('.') for part in p.parts): continue
              ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          print('All Python files parsed cleanly.')
          "
