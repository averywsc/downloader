<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dodown</title>
  <style>
    :root {
      --bg: #050c1f;
      --panel: #091534;
      --ink: #f4f7ff;
      --mute: #8d9cc4;
      --line: #16254d;
      --edge: #34477e;
      --acc: #ffffff;
      --accink: #050c1f;
    }
    * { box-sizing: border-box; }
    body {
      width: 310px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--ink);
      font: 400 13px/1.45 "Archivo", "Segoe UI", Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand img { width: 22px; height: 22px; border-radius: 5px; }
    .brand strong { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--edge);
      background: var(--panel);
      color: var(--mute);
    }
    .pill.ok { color: #4ade80; border-color: #166534; background: rgba(74, 222, 128, 0.1); }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 10px;
    }
    label.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--edge);
      border-radius: 3px;
      padding: 6px 8px;
      font: inherit;
      margin: 6px 0;
    }
    input[type="text"]:focus { outline: none; border-color: var(--acc); }
    .bar { display: flex; gap: 6px; margin-top: 6px; }
    button {
      flex: 1;
      font: inherit;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 3px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button:hover { background: var(--line); }
    button.pri {
      background: var(--acc);
      border-color: var(--acc);
      color: var(--accink);
      font-weight: 700;
    }
    .msg { font-size: 11.5px; color: var(--mute); margin-top: 6px; min-height: 16px; }
    footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--mute);
      padding-top: 4px;
    }
    footer a { color: var(--mute); text-decoration: none; }
    footer a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon48.png" alt="Dodown">
      <strong>Dodown</strong>
    </div>
    <span id="status" class="pill">Checking…</span>
  </header>

  <div class="card">
    <label class="row">
      <span>Intercept browser downloads</span>
      <input type="checkbox" id="enabled" checked>
    </label>
  </div>

  <div class="card">
    <div style="font-size:12px;color:var(--mute)">Quick Send URL</div>
    <input type="text" id="urlInput" placeholder="https://example.com/file.zip">
    <div class="bar">
      <button class="pri" id="sendBtn">Send to Dodown</button>
    </div>
  </div>

  <div class="card">
    <div style="font-size:12px;color:var(--mute)">Desktop Pairing</div>
    <input type="text" id="tokenInput" placeholder="Pairing token (or click Auto Pair)">
    <div class="bar">
      <button class="pri" id="pairBtn">Auto Pair</button>
      <button id="saveTokenBtn">Save Token</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <footer>
    <span id="portLabel">Port 14370</span>
    <a href="https://averybeuth.xyz" target="_blank">averybeuth.xyz</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
